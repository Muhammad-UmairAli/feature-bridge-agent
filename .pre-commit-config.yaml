# Pre-commit hooks. One-time setup per machine:
#   pipx install pre-commit   # or: uv tool install pre-commit
#   pre-commit install
# CI runs the same hooks on every pull request. Fix failures and re-commit;
# don't bypass with --no-verify.

repos:
  # Standard hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Markdown trailing double-spaces are line breaks; keep them.
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        # pnpm's lockfile contains multiple YAML documents.
        args: [--allow-multiple-documents]
      - id: check-json
        # These allow comments (JSONC), which strict JSON parsing rejects.
        exclude: ^(\.vscode/|tsconfig.*\.json$)
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: mixed-line-ending
        args: [--fix=lf]

  # Markdown / YAML / JSON formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [markdown, yaml, json]
        # Workflow files are governed by actionlint; lockfiles are generated.
        exclude: ^(\.github/workflows/|pnpm-lock\.yaml$)

  # GitHub Actions workflow lint
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Secret scanning: blocks commits that contain credentials or tokens
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
