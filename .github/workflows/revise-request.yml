name: Revise request

# Runs when a maintainer applies changes-requested to a coding agent pull
# request (branches request-<number>). The gate job checks the change request
# from the pull request's current state: who applied the label (approver list
# and triage access), how many rounds there have been, and the feedback. The
# first change request is revised; the next one, or one on a pull request
# that already has escalated-to-human, goes to a maintainer.
#
# The revision runs in jobs that never share secrets, like the build: generate
# (model key, "agents" environment, Node's standard library only), check (no
# secrets: the repository's ESLint rules) and publish (coding agent App key,
# "agent-app" environment), each re-checking the change request. The revision
# is one commit on top of the pull request's head when the label was applied.
# The round is recorded before the model is called, so a failed or cancelled
# revision still counts: the pull request then goes to a maintainer, and
# re-runs do nothing.
#
# Runs on pull_request_target so every job comes from the base branch. The
# head commit is fetched as git objects only; nothing from it is checked out,
# installed or run. Off until AGENT_APP_LOGIN is set.
on:
  pull_request_target:
    types: [labeled]
    branches: [main]

permissions: {}

# One revision per pull request at a time; other label events get a group of
# their own, so they can't push a waiting revision out of the queue.
concurrency:
  group: >-
    revise-request-${{ github.event.pull_request.number }}${{
    github.event.label.name != 'changes-requested'
    && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash # bash --noprofile --norc -eo pipefail

jobs:
  gate:
    name: Check change request
    if: >-
      github.event.label.name == 'changes-requested' &&
      vars.AGENT_APP_LOGIN != '' &&
      github.event.pull_request.user.type == 'Bot' &&
      github.event.pull_request.user.login == vars.AGENT_APP_LOGIN &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'request-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the agent scripts
      issues: read # the approved plan on the request issue
      pull-requests: write # labels and fixed comments on the pull request
    outputs:
      accepted: ${{ steps.gate.outputs.accepted }}
      label_event_id: ${{ steps.gate.outputs.label_event_id }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Check change request
        id: gate
        env:
          REVISE_STEP: gate
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AGENT_APP_LOGIN: ${{ vars.AGENT_APP_LOGIN }}
          APPROVER_ALLOWLIST: ${{ vars.APPROVER_ALLOWLIST }}
        run: node agents/coder/run-revise.mts

      # If the check crashed, was cancelled or timed out, don't leave the label
      # behind: applying a label that is already there fires nothing.
      - name: Remove an unchecked change request
        if: (failure() || cancelled()) && steps.gate.outputs.accepted != 'true'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          repo="$GITHUB_REPOSITORY"
          rc=0
          gh api -X DELETE "repos/$repo/issues/$PR_NUMBER/labels/changes-requested" --silent || rc=$?
          body=$(printf '### Change request not checked\n\nThe check failed, was cancelled or timed out, so the %s label was removed. Apply it again to retry.' \
            'changes-requested')
          gh api "repos/$repo/issues/$PR_NUMBER/comments" --silent -f body="$body" || rc=$?
          exit "$rc"

  generate:
    name: Generate revision
    needs: gate
    if: >-
      needs.gate.result == 'success' && needs.gate.outputs.accepted == 'true' &&
      github.run_attempt == '1'
    runs-on: ubuntu-latest
    environment: agents
    timeout-minutes: 30
    permissions:
      contents: read # the agent scripts, AGENTS.md, the shared UI and the head commit's objects
      issues: read # the approved plan on the request issue
      pull-requests: write # record the round; hand over on failure
    outputs:
      built: ${{ steps.generate.outputs.built }}
      bundle: ${{ steps.generate.outputs.bundle }}
      bundle_sha256: ${{ steps.generate.outputs.bundle_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nothing is installed in a job that holds a key.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Fetch the reviewed commit (as data)
        env:
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
        run: git fetch --no-tags --quiet --depth=1 origin "$HEAD_SHA"
      - name: Generate
        id: generate
        env:
          REVISE_STEP: generate
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AGENT_APP_LOGIN: ${{ vars.AGENT_APP_LOGIN }}
          APPROVER_ALLOWLIST: ${{ vars.APPROVER_ALLOWLIST }}
          LABEL_EVENT_ID: ${{ needs.gate.outputs.label_event_id }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MAX_TOKENS_PER_REQUEST: ${{ vars.LLM_MAX_TOKENS_PER_REQUEST }}
        run: node agents/coder/run-revise.mts

  check:
    name: Check revision
    needs: generate
    if: needs.generate.result == 'success' && needs.generate.outputs.built == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # The default branch's lockfile; no install scripts.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint the revised files
        env:
          BUNDLE: ${{ needs.generate.outputs.bundle }}
          BUNDLE_SHA256: ${{ needs.generate.outputs.bundle_sha256 }}
        run: node agents/coder/run-check.mts

  publish:
    name: Push revision
    needs: [gate, generate, check]
    if: needs.check.result == 'success' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    environment: agent-app
    timeout-minutes: 10
    permissions:
      contents: read # the agent scripts
      issues: read # the approved plan on the request issue
      pull-requests: write # report the revision; hand over on failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Publish
        env:
          REVISE_STEP: publish
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AGENT_APP_LOGIN: ${{ vars.AGENT_APP_LOGIN }}
          APPROVER_ALLOWLIST: ${{ vars.APPROVER_ALLOWLIST }}
          LABEL_EVENT_ID: ${{ needs.gate.outputs.label_event_id }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          BUNDLE: ${{ needs.generate.outputs.bundle }}
          BUNDLE_SHA256: ${{ needs.generate.outputs.bundle_sha256 }}
          AGENT_APP_ID: ${{ vars.AGENT_APP_ID }}
          AGENT_APP_PRIVATE_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
        run: node agents/coder/run-revise.mts

  # A revision that crashed, timed out or was cancelled (including a lint
  # failure) hands the pull request to a maintainer. Plain gh; does nothing if
  # it was already handed over or the branch has moved on.
  hand-over:
    name: Hand over a stopped revision
    needs: [gate, generate, check, publish]
    if: >-
      always() && needs.gate.outputs.accepted == 'true' && github.run_attempt == '1' &&
      (contains(fromJSON('["failure", "cancelled"]'), needs.generate.result) ||
        contains(fromJSON('["failure", "cancelled"]'), needs.check.result) ||
        contains(fromJSON('["failure", "cancelled"]'), needs.publish.result))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: write
    steps:
      - name: Hand over to a maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
        run: |
          repo="$GITHUB_REPOSITORY"
          # REST only: the workflow token has pull request access, nothing else.
          view=$(gh api "repos/$repo/pulls/$PR_NUMBER" \
            --jq '([.labels[].name] | join(",")) + " " + .head.sha') || view=""
          labels=${view% *}
          head=${view##* }
          if [[ ",$labels," == *,escalated-to-human,* ]]; then
            echo "Already handed over."
            exit 0
          fi
          if [[ -n "$head" && "$head" != "$HEAD_SHA" ]]; then
            echo "The branch has moved on."
            exit 0
          fi
          rc=0
          gh api "repos/$repo/issues/$PR_NUMBER/labels" --silent -f 'labels[]=escalated-to-human' || rc=$?
          body=$(printf '%s\n### Revision stopped\n\nThe revision failed (including a lint failure in the revised files), was cancelled or timed out. A maintainer will take it from here.' \
            '<!-- feature-bridge-agent:revision-stopped -->')
          gh api "repos/$repo/issues/$PR_NUMBER/comments" --silent -f body="$body" || rc=$?
          exit "$rc"
