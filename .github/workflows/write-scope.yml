name: Write scope

# Pull requests from the coding agent (branches request-<number>) may only add
# or change allowed files in a new demo folder; the agent may not use any other
# branch. See agents/scope-check for the rules.
#
# Runs on pull_request_target so the job and the checker come from the base
# branch: a pull request can't change the check it is judged by. The pull
# request's commits are fetched as git objects only; nothing from them is
# checked out, installed or run. No secrets; read-only token. Make "Write
# scope" a required check on main.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    branches: [main, develop]

permissions: {}

concurrency:
  group: write-scope-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # bash --noprofile --norc -eo pipefail

jobs:
  write-scope:
    name: Write scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The base branch (pull_request_target's default), never the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Exactly the head commit this event is about (a newer push gets its own
      # run); if it's no longer reachable the fetch fails, and so does the check.
      - name: Fetch the pull request's commits (as data)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --quiet origin "$HEAD_SHA"
      - name: Check changed files
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          AGENT_APP_LOGIN: ${{ vars.AGENT_APP_LOGIN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node agents/scope-check/run.mts
